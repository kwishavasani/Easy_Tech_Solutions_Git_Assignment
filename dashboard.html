<!DOCTYPE html>
<html>
<head>
<title>Dashboard - Easy Tech Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 200px;
    background: #1e3c72;
    color: white;
    height: 100vh;
    padding: 20px;
}

.sidebar h2 {
    font-size: 18px;
}

.sidebar p {
    margin: 15px 0;
    cursor: pointer;
}

/* MAIN */
.main {
    flex: 1;
    padding: 30px;
    background: #f4f6f9;
}

.top {
    display: flex;
    justify-content: space-between;
}

.cards {
    display: flex;
    margin-top: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-right: 20px;
    border-radius: 8px;
    width: 150px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.logout {
    background: red;
    color: white;
    padding: 8px 12px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Easy Tech</h2>
    <p>Dashboard</p>
    <p>Projects</p>
    <p>Test Cases</p>
    <p>Reports</p>
    <p onclick="logout()">Logout</p>
</div>

<div class="main">
    <div class="top">
        <h2 id="welcome"></h2>
        <div class="logout" onclick="logout()">Logout</div>
    </div>

    <div class="cards">
        <div class="card">
            <h3>24</h3>
            <p>Test Cases</p>
        </div>

        <div class="card">
            <h3>5</h3>
            <p>Bugs Logged</p>
        </div>

        <div class="card">
            <h3>Passed</h3>
            <p>Build Status</p>
        </div>

        <div class="card">
            <h3>78%</h3>
            <p>Automation</p>
        </div>
    </div>
</div>

<script>
let user = localStorage.getItem("username") || "Ananya";
document.getElementById("welcome").innerText = "Welcome back, " + user + " 👋";

function logout() {
    localStorage.removeItem("username");
    window.location.href = "login.html";
}
</script>

</body>
</html>
